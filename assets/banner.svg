<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="1100" height="280" role="img" aria-label="InstaBOT">
  <defs>
    <!-- Instagram Brand Gradients -->
    <linearGradient id="igGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833ab4"/>
      <stop offset="25%" stop-color="#c13584"/>
      <stop offset="50%" stop-color="#e1306c"/>
      <stop offset="75%" stop-color="#fd1d1d"/>
      <stop offset="100%" stop-color="#f77737"/>
    </linearGradient>

    <linearGradient id="reverseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f77737"/>
      <stop offset="35%" stop-color="#e1306c"/>
      <stop offset="70%" stop-color="#c13584"/>
      <stop offset="100%" stop-color="#833ab4"/>
    </linearGradient>

    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="50%" stop-color="#0f131d"/>
      <stop offset="100%" stop-color="#090b12"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833ab4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c13584" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f77737" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="cardGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c13584" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c13584" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252d42" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .pulsing { animation: pulse 4s ease-in-out infinite; }
      .floating { animation: float 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="280" rx="18" fill="url(#bgGradient)"/>
  <rect width="1100" height="280" rx="18" fill="url(#grid)"/>
  <rect width="1100" height="280" rx="18" fill="url(#cardGlow)"/>
  <rect width="1100" height="280" rx="18" fill="none" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <!-- Logo Mark Circle & Emblem -->
  <g transform="translate(115, 140)">
    <!-- Outer dash glow ring -->
    <circle r="64" fill="none" stroke="url(#reverseGradient)" stroke-width="2.5" stroke-dasharray="10 12" opacity="0.8"/>
    <!-- Core gradient sphere -->
    <circle r="48" fill="url(#igGradient)" class="pulsing"/>
    <!-- Instagram camera glyph outline -->
    <rect x="-22" y="-22" width="44" height="44" rx="12" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="12" cy="-12" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(220, 115)">
    <!-- Title -->
    <text x="0" y="0" class="text-title" font-size="64" fill="url(#reverseGradient)" letter-spacing="1">InstaBOT</text>
    <!-- Tagline -->
    <text x="4" y="38" class="text-sub" font-size="19" fill="#c3cad9">Modular Instagram Direct Bot &amp; Automation Platform</text>
    <!-- Badges Row -->
    <g transform="translate(4, 75)">
      <circle cx="0" cy="0" r="5" fill="#e1306c"/>
      <circle cx="18" cy="0" r="5" fill="#f77737"/>
      <circle cx="36" cy="0" r="5" fill="#833ab4"/>
      <text x="56" y="4" class="text-mono" font-size="13" fill="#8d99ae">by frnAlt &amp; Neoaz • Floppa V2 Ecosystem • 182 Tests Passing</text>
    </g>
  </g>

  <!-- Right Side Feature Chips -->
  <g transform="translate(730, 38)" class="floating">
    <!-- Chip 1: Dual Transport -->
    <g transform="translate(0, 0)">
      <rect width="330" height="42" rx="10" fill="#131722" stroke="#252c3f" stroke-width="1.2"/>
      <polygon points="23,13 17,22 22,22 20,29 28,20 23,20" fill="#3ddc84"/>
      <text x="38" y="26" class="text-mono" font-size="13.5" fill="#3ddc84">Dual Engine: Native ICA + Remote RPC</text>
    </g>

    <!-- Chip 2: Interactive Handlers -->
    <g transform="translate(0, 52)">
      <rect width="330" height="42" rx="10" fill="#131722" stroke="#252c3f" stroke-width="1.2"/>
      <path d="M18,14 C16.9,14 16,14.9 16,16 L16,23 C16,24.1 16.9,25 18,25 L20,25 L20,28 L23.5,25 L30,25 C31.1,25 32,24.1 32,23 L32,16 C32,14.9 31.1,14 30,14 Z" fill="#58a6ff"/>
      <text x="38" y="26" class="text-mono" font-size="13.5" fill="#58a6ff">Interactive onReply &amp; onReaction</text>
    </g>

    <!-- Chip 3: Media & Effects -->
    <g transform="translate(0, 104)">
      <rect width="330" height="42" rx="10" fill="#131722" stroke="#252c3f" stroke-width="1.2"/>
      <path d="M28,14 L21,15.8 L21,23.5 C20.5,23.2 19.8,23 19,23 C17.3,23 16,24.1 16,25.5 C16,26.9 17.3,28 19,28 C20.6,28 21.9,27 22,25.6 L22,19 L28,17.5 L28,22.5 C27.5,22.2 26.8,22 26,22 C24.3,22 23,23.1 23,24.5 C23,25.9 24.3,27 26,27 C27.6,27 28.9,26 29,24.6 L29,14 Z" fill="#e1306c"/>
      <text x="38" y="26" class="text-mono" font-size="13.5" fill="#e1306c">Music Stickers &amp; Direct Text Effects</text>
    </g>

    <!-- Chip 4: Multi-Admin & Security -->
    <g transform="translate(0, 156)">
      <rect width="330" height="42" rx="10" fill="#131722" stroke="#252c3f" stroke-width="1.2"/>
      <path d="M23,13 L30,15.5 L30,20 C30,24.5 23,28 23,28 C23,28 16,24.5 16,20 L16,15.5 Z" fill="#f77737"/>
      <text x="38" y="26" class="text-mono" font-size="13.5" fill="#f77737">Multi-Admin &amp; Silent Bot-Off Logic</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="272" width="1100" height="8" rx="4" fill="url(#reverseGradient)"/>
</svg>
