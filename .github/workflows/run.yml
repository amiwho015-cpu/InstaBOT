name: Goat / InstaBOT Runner

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        type: choice
        options:
          - '22'
          - '20'
        default: '22'
      mode:
        description: 'Execution mode (direct cookies vs server)'
        required: false
        type: choice
        options:
          - 'direct'
          - 'server'
        default: 'direct'

jobs:
  build-and-run:
    name: Run InstaBOT Runner
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '22' }}

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Configure Credentials If Provided
        env:
          ACCOUNT_TXT: ${{ secrets.ACCOUNT_TXT }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
          FB_STATE: ${{ secrets.FB_STATE }}
          IG_API_SERVER: ${{ secrets.IG_API_SERVER }}
          IG_API_TOKEN: ${{ secrets.IG_API_TOKEN }}
        run: |
          if [ -n "$IG_COOKIES" ]; then
            printf '%s\n' "$IG_COOKIES" > account.txt
            echo "Loaded Instagram credentials from IG_COOKIES secret."
          elif [ -n "$ACCOUNT_TXT" ]; then
            printf '%s\n' "$ACCOUNT_TXT" > account.txt
            echo "Loaded Instagram credentials from ACCOUNT_TXT secret."
          elif [ -n "$FB_STATE" ]; then
            printf '%s\n' "$FB_STATE" > account.txt
            echo "Loaded Instagram credentials from FB_STATE secret."
          fi
          if [ -s account.txt ]; then
            echo "account.txt is present and configured ($(wc -c < account.txt) bytes)"
          else
            echo "account.txt will be loaded from repository or environment fallback."
          fi

      - name: Start the Bot
        env:
          PORT: 5000
          NODE_ENV: production
          FORCE_COLOR: '1'
          ACCOUNT_TXT: ${{ secrets.ACCOUNT_TXT }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
          FB_STATE: ${{ secrets.FB_STATE }}
          IG_API_SERVER: ${{ secrets.IG_API_SERVER }}
          IG_API_TOKEN: ${{ secrets.IG_API_TOKEN }}
        run: npm start
